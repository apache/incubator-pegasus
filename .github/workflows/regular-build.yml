---
name: Lint and build regularly

on:
  push:
    paths:
      - '.github/workflows/regular-build.yml'
    branches:
      - master
      - 'v[0-9]+.*' # release branch
      - ci-test # testing branch for github action
      - '*dev' # developing branch

  # for manually triggering workflow
  workflow_dispatch:

  # run for every day 2am UTC+8(Beijing)
  schedule:
    - cron:  '0 18 */1 * *'

jobs:
  lint_cpp:
    name: Lint Cpp
    # Run on the runner host (no `container:`) so that GitHub-injected
    # Node 20 (used by actions/checkout v4+) can execute. The
    # apache/pegasus:clang-format-3.9 image ships GLIBC < 2.28 and cannot
    # run Node 20 binaries, same as in lint_and_test_cpp.yaml.
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install clang-format-3.9 wrapper
        # Keep clang-format 3.9 as the formatter of record (v2.5 code is not
        # formatted with a newer clang-format), but invoke it inside the
        # apache/pegasus:clang-format-3.9 image through a wrapper: the binary
        # depends on libLLVM-3.9.so.1, which ubuntu-22.04 no longer packages.
        run: |
          set -euo pipefail
          docker pull apache/pegasus:clang-format-3.9
          tmp=$(mktemp)
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'exec docker run --rm -i \' \
            '  -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \' \
            '  -w "${GITHUB_WORKSPACE}" \' \
            '  --entrypoint clang-format-3.9 \' \
            '  apache/pegasus:clang-format-3.9 "$@"' \
            > "$tmp"
          sudo install -m 0755 "$tmp" /usr/local/bin/clang-format-3.9
          rm -f "$tmp"
          clang-format-3.9 --version
      - name: clang-format
        run: ./scripts/run-clang-format.py --clang-format-executable clang-format-3.9 -e ./src/shell/linenoise -e ./src/shell/sds -e ./thirdparty -r .

  build_cpp:
    name: Build Cpp
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu1804
          - ubuntu2004
          - ubuntu2204
          - centos7
        compiler:
          - "gcc,g++"
        include:
          - compiler: "clang-14,clang++-14"
            os: ubuntu2204
          - compiler: "clang-10,clang++-10"
            os: ubuntu2004
          - compiler: "clang-9,clang++-9"
            os: ubuntu1804
    container:
      image: apache/pegasus:thirdparties-bin-${{ matrix.os }}-${{ github.ref_name }}
    defaults:
      run:
        working-directory: /root/incubator-pegasus
    steps:
      - name: Clone Apache Pegasus Source
        working-directory: /root
        run: |
          git clone -b ${{ github.ref_name }} --depth=1 https://github.com/apache/incubator-pegasus.git
      - name: Free Disk Space (Ubuntu)
        run: |
          .github/workflows/free_disk_space.sh
      - name: Unpack prebuilt third-parties
        run: |
          rm -f /root/thirdparties-src.zip
          unzip /root/thirdparties-bin.zip -d ./thirdparty
          rm -f /root/thirdparties-bin.zip
          find ./thirdparty -name '*CMakeFiles*' -type d -exec rm -rf "{}" +
          rm -rf ./thirdparty/hadoop-bin/share/doc
          rm -rf ./thirdparty/zookeeper-bin/docs
      - name: Compilation Pegasus
        run: |
          ./run.sh build --test --compiler ${{ matrix.compiler }} --skip_thirdparty -j $(nproc)
      - name: Clear Build Files
        run: |
          find ./build/latest/src/ -name '*CMakeFiles*' -type d -exec rm -rf "{}" +
      - name: Packaging Server
        run: |
          ./run.sh pack_server
          rm -rf pegasus-server-*

  build_and_lint_go:
    name: Build and Lint Golang
    runs-on: ubuntu-22.04
    steps:
      - name: Install thrift
        # go-client imports thrift package of 0.13.0, so we must use thrift-compiler 0.13.0
        # to generate code as well. The thrift-compiler version on ubuntu-22.04 is 0.16.0, so
        # build and install thrift-compiler 0.13.0 manually.
        run: |
          export THRIFT_VERSION=0.13.0
          wget --progress=dot:giga https://github.com/apache/thrift/archive/refs/tags/v${THRIFT_VERSION}.tar.gz
          tar -xzf v${THRIFT_VERSION}.tar.gz
          cd thrift-${THRIFT_VERSION}
          ./bootstrap.sh
          ./configure --enable-libs=no
          make -j"$(nproc)"
          sudo make install
          cd - && rm -rf thrift-${THRIFT_VERSION} v${THRIFT_VERSION}.tar.gz
      - name: Checkout
        # actions/checkout@v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Go
        # actions/setup-go@v4.3.0
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
        with:
          go-version: 1.14
      - name: Build go-client
        run: make
        working-directory: ./go-client
      - name: Lint go-client
        # golangci/golangci-lint-action@v3.7.0
        uses: golangci/golangci-lint-action@3a919529898de77ec3da873e3063ca4b10e7f5cc
        with:
          version: v1.29
          working-directory: ./go-client
      - name: Build admin-cli
        run: make
        working-directory: ./admin-cli
      - name: Lint admin-cli
        # golangci/golangci-lint-action@v3.7.0
        uses: golangci/golangci-lint-action@3a919529898de77ec3da873e3063ca4b10e7f5cc
        with:
          version: v1.29
          working-directory: ./admin-cli
      - name: Build pegic
        run: make
        working-directory: ./pegic
      - name: Lint pegic
        # golangci/golangci-lint-action@v3.7.0
        uses: golangci/golangci-lint-action@3a919529898de77ec3da873e3063ca4b10e7f5cc
        with:
          version: v1.29
          working-directory: ./pegic

  build_java:
    name: Build Java
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '11']
    steps:
      # actions/cache@v3.5.0
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # actions/setup-java@v4.8.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: ${{ matrix.java }}
      - name: Build
        working-directory: ./java-client
        run: |
          cd scripts && bash recompile_thrift.sh && cd -
          mvn spotless:apply
          mvn clean package -DskipTests
