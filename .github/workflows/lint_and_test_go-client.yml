---
# workflow name
name: Golang Lint and Unit Test - go-client

# on events
on:
  # run on each pull request
  pull_request:
    types: [ synchronize, reopened, opened ]
    branches:
      - master
      - 'v[0-9]+.*' # release branch
      - ci-test # testing branch for github action
      - '*dev'
    paths:
      - go-client/**

  # for manually triggering workflow
  workflow_dispatch:

# workflow tasks
jobs:
  build:
    name: Test and Lint
    runs-on: ubuntu-22.04
    # The onebox started by the client tests bundles a ZooKeeper whose JMX
    # agent aborts on JDK 8 in cgroup v2 containers (same failure as
    # scripts/start_zk.sh); zkServer.sh forwards SERVER_JVMFLAGS to it.
    env:
      SERVER_JVMFLAGS: -XX:-UseContainerSupport
    steps:
    - name: Install thrift
      # go-client imports thrift package of 0.13.0, so we must use thrift-compiler 0.13.0
      # to generate code as well. The thrift-compiler version on ubuntu-22.04 is 0.16.0, so
      # build and install thrift-compiler 0.13.0 manually.
      run: |
        export THRIFT_VERSION=0.13.0
        wget --progress=dot:giga https://github.com/apache/thrift/archive/refs/tags/v${THRIFT_VERSION}.tar.gz
        tar -xzf v${THRIFT_VERSION}.tar.gz
        cd thrift-${THRIFT_VERSION}
        ./bootstrap.sh
        ./configure --enable-libs=no
        make -j"$(nproc)"
        sudo make install
        cd - && rm -rf thrift-${THRIFT_VERSION} v${THRIFT_VERSION}.tar.gz
    - name: Checkout
      # actions/checkout@v4.3.1
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Set up Go
      # actions/setup-go@v4.3.0
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
      with:
        go-version: 1.14
    - name: Run Test
      run: ./test.sh
      working-directory: ./go-client
    # because some files are generated after building, so lint after that at last
    - name: Lint
      # golangci/golangci-lint-action@v3.7.0
      uses: golangci/golangci-lint-action@3a919529898de77ec3da873e3063ca4b10e7f5cc
      with:
        version: v1.29
        working-directory: ./go-client
